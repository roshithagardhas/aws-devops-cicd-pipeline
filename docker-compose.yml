services:
  app:
    build: .
    container_name: aws-devops-app

    restart: unless-stopped

    environment:
      NODE_ENV: production
      APP_VERSION: "1.0.0"

    volumes:
      - ./logs:/app/logs

  nginx:
    image: nginx:latest
    container_name: nginx-proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    restart: unless-stopped